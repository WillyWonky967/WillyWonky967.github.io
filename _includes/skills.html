<section id="skills" class="skills-section">
  <h2>Skills</h2>
    
  <ul class="skill-categories">
    {% for skill_group in site.skills %}
      <li>
        <div class="skills-card">
          <span class="category-label">{{ skill_group.category }}</span>
        
          <ul class="skills-list">
            {% for tool in skill_group.tools %}
              <li class="skill">
                {% if tool.name %}
                  <button type="button" class="skill-btn" onclick="openSkillModal('{{ tool.name | escape }}', '{{ tool.desc | escape }}')">
                    {{ tool.name }}
                  </button>
                {% else %}
                  {{ tool }}
                {% endif %}
              </li>
            {% endfor %}
          </ul>
        </div>
      </li> 
    {% endfor %}
  </ul>

<!-- Native HTML Modal Container -->
<dialog id="skill-modal" class="skill-dialog">
  <div class="modal-content">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
    <button type="button" class="close-btn" onclick="document.getElementById('skill-modal').close()">Close</button>
  </div>
</dialog>

<script>
  function openSkillModal(name, description) {
    const modal = document.getElementById('skill-modal');
    document.getElementById('modal-title').textContent = name;
    document.getElementById('modal-desc').textContent = description;
    modal.showModal();
  }
</script>
